name: Audit official festival sources (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit official websites and robots permissions
        run: python scripts/audit_official_sources.py
      - name: Save audit for review
        uses: actions/upload-artifact@v4
        with:
          name: official-source-audit
          path: data/official-source-audit.json
          retention-days: 14
