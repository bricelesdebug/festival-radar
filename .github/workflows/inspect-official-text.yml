name: Inspect official visible text (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect visible text on approved pages
        run: python scripts/inspect_official_text.py
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: official-visible-text-review
          path: data/official-visible-text-review.json
          retention-days: 14
