
name: Collect festival events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official API
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/collect.py

      - name: Commit updated dataset
        run: |
          git config user.name "festival-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/festivals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update festival discovery data"
            git push
          fi
