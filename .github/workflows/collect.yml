
name: Collect festival events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: festival-radar-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Save previous snapshot for comparison
        run: |
          if [ -f data/festivals.json ]; then
            cp data/festivals.json /tmp/festival-radar-previous.json
          fi

      - name: Fetch official API
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/collect.py

      - name: Audit catalog quality
        run: python scripts/audit_catalog.py data/festivals.json

      - name: Detect candidate changes (no email sending)
        run: |
          if [ -f /tmp/festival-radar-previous.json ]; then
            python scripts/detect_alerts.py /tmp/festival-radar-previous.json data/festivals.json -o /tmp/festival-radar-alert-candidates.json
          else
            echo 'No baseline: skipping alerts to avoid false new-event notifications'
          fi

      - name: Upload review-only alert candidates
        if: ${{ hashFiles('data/festivals.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: festival-radar-alert-candidates
          path: /tmp/festival-radar-alert-candidates.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload collection health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-health
          path: /tmp/festival-radar-collection-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated dataset
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "festival-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the newly collected dataset safe while synchronizing the branch.
          cp data/festivals.json /tmp/festival-radar-new.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/festival-radar-new.json data/festivals.json
            git add data/festivals.json
            if git diff --cached --quiet; then
              echo "No dataset changes to publish"
              exit 0
            fi
            git commit -m "Update festival discovery data"
            if git push origin HEAD:main; then
              echo "Dataset published successfully"
              exit 0
            fi
            echo "Concurrent push detected, retrying ($attempt/3)"
            sleep 2
          done
          echo "Could not publish dataset after 3 attempts"
          exit 1
