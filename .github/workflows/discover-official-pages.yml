name: Discover official festival pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover candidate official links
        run: python scripts/discover_official_pages.py
      - name: Upload review-only link report
        uses: actions/upload-artifact@v4
        with:
          name: official-page-candidates
          path: data/official-page-candidates.json
          retention-days: 14
